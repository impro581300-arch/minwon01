<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>민원서비스 찾기</title><link rel="stylesheet" href="style.css"></head><body><header><div class="wrap"><h1>민원서비스 찾기</h1><p>서비스명 검색과 민원분야 필터로 원하는 서비스를 빠르게 찾아보세요.</p></div></header><main class="wrap"><section class="controls" aria-label="검색 및 필터"><div class="field search"><label for="keyword">서비스명 검색</label><input id="keyword" type="search" placeholder="예: 여권, 발급, 신고" autocomplete="off"></div><div class="field"><label for="category">민원분야</label><select id="category"><option value="">전체 분야</option></select></div><button id="reset" type="button">초기화</button></section><div class="summary" aria-live="polite">현재 표시 <strong id="count">22</strong>건 <span>/ 전체 22건</span></div><section class="table-wrap"><table><thead><tr><th>서비스명</th><th>소관기관</th><th>민원분야</th><th>온라인처리</th><th>처리기한</th><th>수수료</th></tr></thead><tbody id="serviceRows"></tbody></table><div id="empty" class="empty" hidden>조건에 맞는 민원서비스가 없습니다.</div></section></main><script src="app.js"></script></body></html>
